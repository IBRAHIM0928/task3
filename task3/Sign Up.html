<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>Sign Up</title>
</head>
<body class="signup-body">
    <div class="sign">
        <h2>Create an Account</h2>
    <form action="#" class="signup-form">
        <label for="username">Full Name:</label>
        <input type="text" id="username" name="username" placeholder="Enter your full Name*" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email*" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter strong Password*" required>
        <label for="password"> Confirm Password</label>
        <input type="password" id="password" name="password" placeholder="Confirm Password*" required>
        <div class="remember">
        <p><input type="checkbox" id="remember"> Remember me</p>
        </div>

        <button type="submit">Sign Up</button>
        <p>Already have account? <a href="index.html">Log in</a></p>

    </form>
    </div>
</body>

</html>
